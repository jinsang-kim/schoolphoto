<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>인생네컷 사진 & 촬영 영상 다운로드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; font-weight: 800; color: #38bdf8; margin-bottom: 4px; }
    .header p { font-size: 14px; color: #94a3b8; }
    
    .retention-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 9999px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: 600;
    }

    /* 탭 네비게이션 (사진 / 촬영 영상) */
    .tab-nav {
      display: flex;
      gap: 8px;
      background: #1e293b;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid #334155;
      margin-bottom: 18px;
      width: 100%;
      max-width: 360px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .preview-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 100%;
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      min-height: 280px;
      position: relative;
    }
    .preview-card img,
    .preview-card video {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
      display: block;
      object-fit: contain;
    }

    .action-group {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
      transition: transform 0.1s ease;
    }
    .download-btn:active {
      transform: scale(0.98);
    }
    .download-btn.video-btn {
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }

    .tip { font-size: 12.5px; color: #64748b; text-align: center; line-height: 1.5; }
    .not-found { text-align: center; padding: 40px 20px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ 인생네컷 다운로드 ✨</h1>
    <p>사진과 촬영 비하인드 영상을 스마트폰에 저장해보세요!</p>
    <div class="retention-badge" id="retention-badge">
      📅 유효기간: 촬영일로부터 7일간 보관
    </div>
  </div>

  <!-- 탭 버튼 (사진 보기 / 영상 보기) -->
  <div class="tab-nav" id="tab-nav" style="display: none;">
    <button class="tab-btn active" id="tab-photo-btn" onclick="switchTab('photo')">
      📷 사진 다운로드
    </button>
    <button class="tab-btn" id="tab-video-btn" onclick="switchTab('video')">
      🎥 촬영 영상 (타임랩스)
    </button>
  </div>

  <div class="preview-card" id="card-box">
    <!-- 사진 뷰어 -->
    <img id="photo-img" src="" alt="인생네컷 사진" style="display: none;">
    <!-- 영상 뷰어 -->
    <video id="video-player" src="" playsinline controls loop style="display: none;"></video>
    
    <div id="loading-msg" style="padding: 40px 20px; color: #94a3b8; text-align: center;">사진을 불러오는 중입니다...</div>
  </div>

  <div class="action-group" id="action-box" style="display: none;">
    <!-- 사진 다운로드 버튼 -->
    <a id="dl-btn" href="#" download="life4cut_photo.jpg" class="download-btn">
      💾 고화질 사진 저장하기
    </a>
    <!-- 영상 다운로드 버튼 -->
    <a id="dl-video-btn" href="#" download="life4cut_video.webm" class="download-btn video-btn" style="display: none;">
      🎬 촬영 영상 저장하기
    </a>

    <p class="tip">※ 보관 유효기간(7일)이 지나면 개인정보 보호를 위해 자동 삭제됩니다.</p>
    <p class="tip" id="save-tip-text">※ 아이폰/갤럭시: 사진 또는 영상을 길게 누른 후 '사진 앱에 저장'을 터치하셔도 됩니다.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imgUrl = params.get('img');
    const file = params.get('file');
    const video = params.get('video');

    const photoImg = document.getElementById('photo-img');
    const videoPlayer = document.getElementById('video-player');
    const loadingMsg = document.getElementById('loading-msg');
    const actionBox = document.getElementById('action-box');
    const tabNav = document.getElementById('tab-nav');
    const tabPhotoBtn = document.getElementById('tab-photo-btn');
    const tabVideoBtn = document.getElementById('tab-video-btn');
    const dlBtn = document.getElementById('dl-btn');
    const dlVideoBtn = document.getElementById('dl-video-btn');

    let currentTab = 'photo';
    let targetPhotoSrc = '';
    let targetVideoSrc = '';

    // 1. 사진 후보 URL 리스트 구성 (글로벌 CDN과 로컬/클라우드 서버 양방향 자동 Fallback)
    const isLocalHost =
      window.location.hostname === 'localhost' ||
      window.location.hostname === '127.0.0.1' ||
      /^10\.|^192\.168\.|^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(window.location.hostname);

    const photoCandidates = [];
    if (isLocalHost) {
      if (file) photoCandidates.push('/uploads/' + file);
      if (imgUrl) photoCandidates.push(imgUrl);
      if (file) photoCandidates.push('https://schoolphoto.vercel.app/uploads/' + file);
    } else {
      if (imgUrl) photoCandidates.push(imgUrl);
      if (file) photoCandidates.push('/uploads/' + file);
      if (file && !window.location.hostname.includes('vercel.app')) {
        photoCandidates.push('https://schoolphoto.vercel.app/uploads/' + file);
      }
    }

    // 2. 영상 후보 URL 리스트 구성
    const videoCandidates = [];
    const baseName = file ? file.replace(/\.[^/.]+$/, '') : (video ? video.replace(/_video\.[^/.]+$/, '') : '');
    if (video) {
      if (video.startsWith('http')) {
        videoCandidates.push(video);
      } else {
        videoCandidates.push('/uploads/' + video);
        if (!window.location.hostname.includes('vercel.app')) {
          videoCandidates.push('https://schoolphoto.vercel.app/uploads/' + video);
        }
      }
    }
    if (baseName) {
      const webmLocal = '/uploads/' + baseName + '_video.webm';
      const mp4Local = '/uploads/' + baseName + '_video.mp4';
      if (!videoCandidates.includes(webmLocal)) videoCandidates.push(webmLocal);
      if (!videoCandidates.includes(mp4Local)) videoCandidates.push(mp4Local);
      if (!window.location.hostname.includes('vercel.app')) {
        videoCandidates.push('https://schoolphoto.vercel.app/uploads/' + baseName + '_video.webm');
        videoCandidates.push('https://schoolphoto.vercel.app/uploads/' + baseName + '_video.mp4');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      if (tab === 'photo') {
        tabPhotoBtn.classList.add('active');
        tabVideoBtn.classList.remove('active');
        photoImg.style.display = 'block';
        videoPlayer.style.display = 'none';
        videoPlayer.pause();
        dlBtn.style.display = 'flex';
        dlVideoBtn.style.display = 'none';
      } else {
        tabPhotoBtn.classList.remove('active');
        tabVideoBtn.classList.add('active');
        photoImg.style.display = 'none';
        videoPlayer.style.display = 'block';
        videoPlayer.play().catch(() => {});
        dlBtn.style.display = 'none';
        dlVideoBtn.style.display = 'flex';
      }
    }

    // 원클릭 파일 강제 다운로드 헬퍼 (Cross-Origin CDN 이미지 및 비디오 모두 파일로 즉시 저장)
    async function triggerFileDownload(e, srcUrl, defaultName, fileParam) {
      e.preventDefault();
      if (!srcUrl) return;

      const btn = e.currentTarget;
      const origHtml = btn.innerHTML;
      btn.innerHTML = '⏳ 기기에 저장 중...';

      try {
        // 1순위: 서버 다운로드 프록시(/api/proxy-download)가 가능한 경우 Content-Disposition: attachment로 즉시 다운로드
        const proxyParams = new URLSearchParams();
        if (fileParam) proxyParams.set('file', fileParam);
        if (srcUrl.startsWith('http')) proxyParams.set('url', srcUrl);
        proxyParams.set('name', defaultName);

        const proxyUrl = '/api/proxy-download?' + proxyParams.toString();
        const headCheck = await fetch(proxyUrl, { method: 'HEAD' }).catch(() => null);
        if (headCheck && headCheck.ok) {
          const a = document.createElement('a');
          a.href = proxyUrl;
          a.download = defaultName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => { btn.innerHTML = origHtml; }, 900);
          return;
        }

        // 2순위: 브라우저 Fetch -> Blob 변환 후 ObjectURL 다운로드
        const res = await fetch(srcUrl, { mode: 'cors' });
        if (res.ok) {
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = defaultName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
          btn.innerHTML = origHtml;
          return;
        }
      } catch (err) {
        console.warn('Blob 다운로드 전환:', err);
      }

      // 3순위: 기본 링크 열기
      btn.innerHTML = origHtml;
      window.open(srcUrl, '_blank');
    }

    // 사진 로드 시도 및 다중 Fallback 처리
    let photoLoadFailed = false;
    let videoLoadFailed = false;

    function checkOverallState() {
      if (photoLoadFailed && videoLoadFailed) {
        loadingMsg.style.display = 'block';
        loadingMsg.innerHTML = '사진을 찾을 수 없습니다 😢<br><span style="font-size:12px;color:#64748b;margin-top:6px;display:block;">보관 기간(7일)이 만료되었거나 존재하지 않는 링크입니다.</span>';
      }
    }

    function tryLoadPhotoCandidate(index) {
      if (index >= photoCandidates.length) {
        photoLoadFailed = true;
        photoImg.style.display = 'none';
        checkVideoAvailability(0);
        checkOverallState();
        return;
      }

      const candidate = photoCandidates[index];
      photoImg.onload = () => {
        targetPhotoSrc = candidate;
        loadingMsg.style.display = 'none';
        photoImg.style.display = 'block';
        actionBox.style.display = 'flex';
        const downloadFileName = file || `life4cut_${Date.now()}.jpg`;
        dlBtn.href = candidate;
        dlBtn.download = downloadFileName;
        dlBtn.onclick = (e) => triggerFileDownload(e, targetPhotoSrc, downloadFileName, file);
        checkVideoAvailability(0);
      };
      photoImg.onerror = () => {
        console.warn('사진 후보 로드 실패, 다음 후보 시도:', candidate);
        tryLoadPhotoCandidate(index + 1);
      };
      photoImg.src = candidate;
    }

    if (photoCandidates.length > 0) {
      tryLoadPhotoCandidate(0);
    } else {
      photoLoadFailed = true;
      checkVideoAvailability(0);
      checkOverallState();
    }

    // 영상 가용 여부 다중 후보 확인
    function checkVideoAvailability(vIndex) {
      if (vIndex >= videoCandidates.length) {
        videoLoadFailed = true;
        checkOverallState();
        return;
      }

      const candidateVid = videoCandidates[vIndex];
      const testVid = document.createElement('video');
      testVid.preload = 'metadata';
      testVid.muted = true;
      testVid.playsInline = true;

      let handled = false;
      const onSuccess = () => {
        if (handled) return;
        handled = true;
        targetVideoSrc = candidateVid;
        tabNav.style.display = 'flex';
        videoPlayer.src = candidateVid;
        const ext = candidateVid.endsWith('.mp4') ? 'mp4' : 'webm';
        const vidDownloadName = video || `life4cut_video_${Date.now()}.${ext}`;
        dlVideoBtn.href = candidateVid;
        dlVideoBtn.download = vidDownloadName;
        dlVideoBtn.onclick = (e) => triggerFileDownload(e, targetVideoSrc, vidDownloadName, vidDownloadName);

        if (photoLoadFailed) {
          loadingMsg.style.display = 'none';
          actionBox.style.display = 'flex';
          switchTab('video');
        }
      };

      const onFail = () => {
        if (handled) return;
        handled = true;
        checkVideoAvailability(vIndex + 1);
      };

      testVid.onloadedmetadata = onSuccess;
      testVid.onloadeddata = onSuccess;
      testVid.oncanplay = onSuccess;
      testVid.onerror = onFail;
      testVid.src = candidateVid;
    }
  </script>
</body>
</html>
